<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Planner Docente 2026 - Organização e Planejamento para Professores">
    <meta name="theme-color" content="#0f172a">

    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com https://lh3.googleusercontent.com; connect-src 'self' https://identitytoolkit.googleapis.com https://firestore.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://www.gstatic.com https://generativelanguage.googleapis.com; frame-src 'self' https://planner-9aeac.firebaseapp.com https://phet.colorado.edu;">


    <title>Planner Pro Docente 2026</title>

    <link rel=" icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        #toast-container {
            position: fixed !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            display: flex !important;
            z-index: 999999 !important;
            pointer-events: none;
        }

        #toast-container>div {
            pointer-events: auto;
        }
    </style>
</head>

<body class="l-app">

    <aside id="app-sidebar" class="l-sidebar">
        <div class="sidebar__header">
            <div class="sidebar__brand">
                <div class="sidebar__logo-icon">
                    <i class="fas fa-graduation-cap" style="font-size: 0.875rem;"></i>
                </div>
                <div class="logo-text transition-opacity-300">
                    <h1 class="sidebar__title">Planner</h1>
                    <p class="sidebar__subtitle">Docente 2026</p>
                </div>
            </div>
            <button onclick="controller.toggleSidebar()" class="sidebar__toggle" title="Menu">
                <i id="sidebar-toggle-icon" class="fas fa-bars"></i>
            </button>
        </div>

        <nav class="sidebar__nav custom-scrollbar">
            <!-- CATEGORIA: PRINCIPAL -->
            <p class="sidebar__section-title sidebar__section-title--first">
                Principal
            </p>

            <button id="nav-dashboard" onclick="controller.navigate('dashboard')" class="nav-item" title="Início">
                <div class="nav-item__icon">
                    <i class="fas fa-home"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Início</span>
            </button>

            <button id="nav-biblioteca" onclick="controller.navigate('biblioteca')" class="nav-item"
                title="Meus materiais">
                <div class="nav-item__icon">
                    <i class="fas fa-folder-open"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Meus materiais</span>
            </button>

            <button id="nav-criar-material" onclick="controller.navigate('criar-material')" class="nav-item"
                title="Criar Material">
                <div class="nav-item__icon">
                    <i class="fas fa-magic"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Criar Material</span>
            </button>

            <button id="nav-turmas" onclick="controller.navigate('turmas')" class="nav-item" title="Turmas">
                <div class="nav-item__icon">
                    <i class="fas fa-users"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Turmas</span>
            </button>

            <button id="nav-quiz-gestor" onclick="controller.navigate('quiz-gestor')" class="nav-item"
                title="Quiz ao vivo">
                <div class="nav-item__icon">
                    <i class="fas fa-gamepad"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Quiz ao vivo</span>
            </button>

            <button id="nav-correcao" onclick="controller.navigate('correcao')" class="nav-item"
                title="Correção Automática">
                <div class="nav-item__icon">
                    <i class="fas fa-magic"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Correção IA</span>
            </button>

            <button id="nav-simuladores" onclick="controller.navigate('simuladores')" class="nav-item"
                title="Simulações Interativas">
                <div class="nav-item__icon">
                    <i class="fas fa-flask"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Simulações</span>
            </button>

            <!-- CATEGORIA: PLANEJAMENTO E CONTEÚDO -->
            <p class="sidebar__section-title">
                Planejamento & Conteúdo
            </p>

            <button id="nav-periodo" onclick="controller.navigate('periodo')" class="nav-item" title="Por Período">
                <div class="nav-item__icon">
                    <i class="fas fa-layer-group"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Por Período</span>
            </button>

            <button id="nav-mensal" onclick="controller.navigate('mensal')" class="nav-item" title="Mensal">
                <div class="nav-item__icon">
                    <i class="far fa-calendar-alt"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Mensal</span>
            </button>

            <button id="nav-dia" onclick="controller.navigate('dia')" class="nav-item" title="Diário">
                <div class="nav-item__icon">
                    <i class="fas fa-edit"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Diário</span>
            </button>

            <button id="nav-provas" onclick="controller.navigate('provas')" class="nav-item" title="Banco de Questões">
                <div class="nav-item__icon">
                    <i class="fas fa-file-signature"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Banco de Questões</span>
            </button>

            <button id="nav-bncc" onclick="controller.navigate('bncc')" class="nav-item" title="Consulta BNCC">
                <div class="nav-item__icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Consulta BNCC</span>
            </button>

            <button id="nav-bimestralizacao" onclick="controller.navigate('bimestralizacao')" class="nav-item" title="Bimestralizações">
                <div class="nav-item__icon">
                    <i class="fas fa-layer-group"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Bimestralizações</span>
            </button>

            <button id="nav-comunidade" onclick="controller.navigate('comunidade')" class="nav-item" title="Comunidade">
                <div class="nav-item__icon">
                    <i class="fas fa-globe-americas"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Comunidade</span>
            </button>

            <!-- CATEGORIA: ROTINA E ACADÊMICO -->
            <p class="sidebar__section-title">
                Rotina & Acadêmico
            </p>

            <button id="nav-frequencia" onclick="controller.navigate('frequencia')" class="nav-item" title="Frequência">
                <div class="nav-item__icon">
                    <i class="fas fa-check-double"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Frequência</span>
            </button>

            <button id="nav-horario" onclick="controller.navigate('horario')" class="nav-item" title="Grade Horária">
                <div class="nav-item__icon">
                    <i class="far fa-clock"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Grade Horária</span>
            </button>

            <button id="nav-mapa" onclick="controller.navigate('mapa')" class="nav-item" title="Mapa de Sala">
                <div class="nav-item__icon">
                    <i class="fas fa-th"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Mapa de Sala</span>
            </button>

            <button id="nav-notas-anuais" onclick="controller.navigate('notas-anuais')" class="nav-item"
                title="Notas Anuais">
                <div class="nav-item__icon">
                    <i class="fas fa-award"></i>
                </div>
                <span class="nav-label" style="font-size: 0.875rem; font-weight: 500;">Notas Anuais</span>
            </button>

            <!-- CATEGORIA: CONTA -->
            <div class="mt-auto pt-6 pb-2 space-y-2">
                <p class="sidebar__section-title">
                    Conta
                </p>

                <button id="nav-config" onclick="controller.navigate('config')" class="nav-item" title="Perfil">
                    <div class="nav-item__icon">
                        <i class="far fa-user"></i>
                    </div>
                    <span class="nav-label">Perfil</span>
                </button>

                <div id="auth-container" class="px-1 mt-2">
                    <button onclick="controller.handleLogin()" class="btn-login">
                        <div class="btn-login__icon-wrapper">
                            <i class="fab fa-google" style="color: var(--color-primary);"></i>
                        </div>
                        <span class="nav-label">Entrar</span>
                    </button>
                </div>
            </div>
        </nav>
        <div class="sidebar-footer nav-label"
            style="padding: 0.75rem; background-color: rgba(0, 0, 0, 0.2); font-size: 0.625rem; text-align: center; color: var(--color-slate-500);">
            v1.3.1 (Cloud)
        </div>
    </aside>

    <main id="main-content" class="l-main">
        <header class="l-header">
            <div class="header__group">
                <button type="button" onclick="controller.toggleSidebar()" class="header__toggle-btn" title="Alternar Barra Lateral (Sanfona)">
                    <i id="header-sidebar-toggle-icon" class="fas fa-bars"></i>
                </button>
                <div id="breadcrumb" class="header__breadcrumb">
                    <i class="fas fa-home" style="color: var(--color-slate-300);"></i> <span
                        style="color: var(--color-slate-300);">/</span> Início
                </div>
            </div>
            <div class="header__group">
                <div id="cloud-status" class="status-badge" title="Status de Sincronização">
                    <i class="fas fa-cloud" style="color: var(--color-slate-300);"></i>
                </div>

                <button onclick="window.print()" class="btn-primary">
                    <i class="fas fa-print"></i> <span class="desktop-only">Gerar PDF</span>
                </button>

                <button onclick="controller.exportData()" class="btn-icon" title="Backup Local (JSON)">
                    <i class="fas fa-download"></i>
                </button>

                <div id="current-date" class="header__date-badge">
                </div>
            </div>
        </header>

        <section id="view-container" class="l-content-container">
        </section>
    </main>

    <div id="global-modal" class="modal-backdrop hidden">
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    <!--
    <script type="module" src="./js/controller.js"></script>
    -->
    <script type="module" src="./js/app.js"></script>

    <script>
        window.addEventListener('load', () => {
            if (window.innerWidth < 768) {
                document.getElementById('app-sidebar').classList.add('collapsed');
                document.getElementById('main-content').classList.add('expanded-content');
            }
        });
    </script>
</body>


</html>
